apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native app configuration - see
 * https://reactnative.dev/docs/react-native-gradle-plugin
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Release signing (Google Play):
 * create android/keystore.properties (gitignored) with:
 *   storeFile=waketune-release.keystore
 *   storePassword=...
 *   keyAlias=waketune
 *   keyPassword=...
 * and the keystore itself at android/app/waketune-release.keystore.
 * Generation command + full store flow: docs/RELEASE.md
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.waketune"
    defaultConfig {
        applicationId "com.waketune"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"

        // react-native-app-auth: the custom scheme Spotify redirects back to
        // (must match SPOTIFY_REDIRECT_URL in src/services/spotify/spotifyAuth.ts
        // and the redirect URI registered in the Spotify developer dashboard).
        manifestPlaceholders = [appAuthRedirectScheme: 'waketune']
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Falls back to the debug keystore for local release builds when
            // no keystore.properties exists; Play uploads require the real one.
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
